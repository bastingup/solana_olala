# =====================================================================
# MASTER CONFIG EXAMPLE — copy to config.yaml and fill in your keys.
#
# config.yaml is gitignored (it holds credentials). The two trading
# profiles are NOT — they are shareable presets:
#     hft: true   ->  config.hft.yaml    (high-frequency traders)
#     hft: false  ->  config.slow.yaml   (slow / swing traders)
#
# Both flags below are read at BOOT ONLY — change one, restart.
# =====================================================================

# THE FILTER SWITCH (note the direction):
#   true  -> APPLY every filter in `filters_onchain` (strict)
#   false -> IGNORE them: follow what on-chain discovery finds
# Governs the on-chain stream only; `filters_solanatracker` configures
# the leaderboard stream. Live wallets always get the safety screen.
dev_mode: false

# Trading profile selector — see the two config.<profile>.yaml files.
hft: false

server:
  host: 127.0.0.1
  port: 8420

chain:
  rpc_endpoints:
  - https://api.mainnet-beta.solana.com
  - https://solana-rpc.publicnode.com
  # Optional. A free key upgrades throughput from ~2 to 8 req/s.
  helius_api_key:
  # Optional PnL leaderboard feeder. Empty = purely on-chain discovery
  # (census + winners' holders); any failure falls through to on-chain.
  # Free key: https://www.solanatracker.io/data-api (10k requests/month)
  solana_tracker_api_key:
  requests_per_second: 2.0
  request_timeout_sec: 15.0

# ---------------------------------------------------------------------
# RISK EXPOSURE — how much money any single trade may touch. Deliberately
# NOT part of a trading profile: switching strategy must never silently
# change your exposure.
# ---------------------------------------------------------------------
risk:
  max_liquidity_fraction: 0.01
  reserve_fraction: 0.3
  per_trade_fraction: 0.05
  max_positions_per_wallet: 8
  atr_period: 14
  atr_stop_multiplier: 3.5
  # LP vaults count toward this, so values below ~0.3 reject almost
  # every real token.
  max_token_top10_holder_fraction: 0.5
  max_live_wallets_per_token: 2

paper:
  wallet_count: 3
  starting_sol: 10.0
