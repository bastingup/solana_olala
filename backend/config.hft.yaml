# =====================================================================
# HIGH-FREQUENCY PROFILE — active when `hft: true` in config.yaml.
#
# Chases traders doing up to ~500 trades/day. Judgment is net realized
# PnL + SHARP over a SHORT window (a 7-day window is already a ~3,500
# trade sample for such a wallet); persistence is enforced separately by
# requiring 30 active trading days on the nomination board.
#
# RPC ledger, ~1M Helius credits/month: discovery 648k + follow poll
# 144k + copy fetches 150k + safety screens 45k = ~987k.
# =====================================================================

# STREAM B FILTERS — applied only when dev_mode: true.
filters_onchain:
  # The 7d window is the JUDGE. 30-day persistence is enforced free via
  # leaderboard.min_active_days below (stream A).
  min_history_days: 7
  min_trades: 20
  # Closed round trips before a win rate means anything.
  min_round_trips: 10
  # BAG-ADJUSTED win rate. NOTE: at a 7d window with 7d staleness the
  # bag adjustment barely bites — judgment leans on the hard
  # net-realized-PnL gate and SHARP (operator accepted this trade-off).
  min_win_rate: 0.9
  min_sharpe: 0.02
  stale_bag_days: 7.0
  # A high-frequency wallet silent for a day is dead.
  max_inactive_hours: 24
  # THE AFFORDABILITY CEILING. Copying costs ~2 RPC calls per trade, so
  # 3 seats x 2,000 trades/day = 12,000 calls/day, which together with
  # discovery and polling lands at ~0.99M of the 1M free tier. Raising
  # this is the fastest way to blow the budget: at 8,000 it would cost
  # 2.22M/month. The pre-screen bot ceiling scales with it (x5 = 10,000
  # signatures/day), still short of the 23,000/day monsters.
  max_trades_per_day: 2000.0
  # Never reject on hold time: fast styles are the point here. Whether
  # their edge SURVIVES our ~2-5s copy latency is measured in paper.
  min_median_hold_minutes: 0.0
  min_token_market_cap_usd: 500000.0
  min_token_liquidity_usd: 50000.0
  max_token_market_cap_usd: 50000000000.0

# STREAM A — the service ranks and vets; we take what it returns.
# The `filters` section above does NOT apply here: it governs the
# on-chain stream, where nobody has done the work for us.
filters_solanatracker:
  # ROI separates skill from scale. MEASURED 2026-08-18: ranking by
  # absolute PnL returns a board whose MEDIAN wallet does 487,000 trades
  # at 16,000/day — MEV machines out-earn humans in dollars. Machines
  # show ~20-85% return on enormous volume; real traders show hundreds
  # to thousands of percent.
  sort: roi
  window_days: 30
  # 10 of 30 days = genuinely active, without demanding the every-day
  # cadence only bots sustain.
  min_active_days: 10
  min_trades: 20
  min_roi_pct: 100.0
  min_win_rate_pct: 55.0
  pages: 3
  # 3 pages/hour = ~2.2k of the 10k/month free tier.
  interval_sec: 3600
  # NOT a quality judgment — the speed past which we can neither copy a
  # trader nor afford the RPC. 0 disables.
  max_trades_per_day: 2000.0

# STREAM B — our own on-chain discovery. The `filters` section above is
# the admission gate for THESE candidates.
discovery:
  # 60 calls per 5-minute sweep ~= 518k credits/month. Trimmed from 75
  # deliberately: those calls are worth more as copy volume once the
  # roster is full, and the 7-day depth requirement makes verdicts fast
  # anyway (a candidate finalizes as soon as its scan covers 7.7 days).
  scan_interval_sec: 300
  rpc_calls_per_scan: 60
  # Live DEX flow is dominated by high-frequency bots, so the census
  # stays a cheap backstop with a high sighting bar.
  census_tx_sample: 8
  census_min_sightings: 3
  # Winners' holders finds token-pickers, not HF traders — keep it small
  # so it cannot eat the sweep budget.
  winners_per_scan: 3
  max_candidates_per_scan: 120
  # Few seats = more RPC headroom per trader and faster roster upgrades.
  max_followed_traders: 3
  # Deep enough for ~7.7 days of a ~1,500 signatures/day wallet.
  signatures_per_trader: 12000
  skill_window_days: 7
  replace_margin: 0.02

follow:
  # Push (logsSubscribe) delivers copies in ~2s; this interval poll is
  # only the safety net, so it is stretched to spend the budget on real
  # copies instead. At 3 traders / 120s it costs ~65k credits/month.
  # Safe: at 2,000 trades/day a trader emits ~3 signatures per 120s,
  # far inside the follower's 30-signature poll window.
  poll_interval_sec: 120
  # Open positions re-price this often (DexScreener, not RPC-metered).
  price_mark_interval_sec: 20
