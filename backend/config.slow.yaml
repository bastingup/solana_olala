# =====================================================================
# SLOW / SWING PROFILE — active when `hft: false` in config.yaml.
#
# Chases patient traders: real month-plus track records, human cadence,
# positions held long enough that our ~2-5s copy latency is irrelevant.
# Judgment leans on the BAG-ADJUSTED win rate, which actually bites here
# because the 30-day window is wide enough for stale bags to show.
#
# RPC ledger, ~1M Helius credits/month: discovery 648k + follow poll
# 230k + copy fetches 20k + safety screens 45k = ~943k.
# =====================================================================

# STREAM B FILTERS — applied only when dev_mode: true.
filters_onchain:
  # A real track record, not a hot streak.
  min_history_days: 30
  min_trades: 20
  min_round_trips: 10
  # BAG-ADJUSTED win rate — meaningful at this window: every unsold bag
  # older than stale_bag_days counts as a realized loss, so the
  # "never sell the losers" wallet collapses here.
  min_win_rate: 0.8
  min_sharpe: 0.0
  stale_bag_days: 10.0
  # A swing trader may reasonably be quiet over a long weekend.
  max_inactive_hours: 96
  # Human cadence only: anything faster is a bot or uncopyable.
  max_trades_per_day: 40.0
  # Positions must be held long enough that copy latency is noise.
  min_median_hold_minutes: 30.0
  min_token_market_cap_usd: 500000.0
  min_token_liquidity_usd: 50000.0
  max_token_market_cap_usd: 50000000000.0

# STREAM A — the service ranks and vets; we take what it returns.
# The `filters` section above governs the on-chain stream, not this one.
filters_solanatracker:
  # ROI ranking surfaces skill over scale here too, and the win-rate
  # floor is left off: at a 30d window our own bag adjustment is the
  # honest judge of win rate, and that runs on the on-chain stream.
  sort: roi
  window_days: 30
  min_active_days: 10
  min_trades: 20
  min_roi_pct: 50.0
  min_win_rate_pct: 0.7
  pages: 3
  interval_sec: 3600
  # Human cadence only — matches what this profile can copy.
  max_trades_per_day: 40.0

# STREAM B — our own on-chain discovery, gated by `filters` above.
discovery:
  scan_interval_sec: 300
  rpc_calls_per_scan: 75
  census_tx_sample: 8
  census_min_sightings: 3
  # Winners' holders earns its keep here: it finds patient token-pickers.
  winners_per_scan: 4
  max_candidates_per_scan: 10000
  # Low-volume traders cost little to follow, so more seats fit.
  max_followed_traders: 8
  signatures_per_trader: 3000
  skill_window_days: 30
  replace_margin: 0.02

follow:
  poll_interval_sec: 90
  price_mark_interval_sec: 20
